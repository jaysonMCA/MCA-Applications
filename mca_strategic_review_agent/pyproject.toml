[project]
name = "mca-strategic-review-agent"
version = "0.1.0"
description = "Local scaffold for MCA strategic company review workflows."
requires-python = ">=3.10"
dependencies = [
    "pypdf>=6.16.0",
    "python-docx>=1.2.0",
    "reportlab>=5.0.0",
]

[project.scripts]
mca-review = "mca_review_agent.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
